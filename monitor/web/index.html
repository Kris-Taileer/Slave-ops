<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether — AD Control Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-palenight.min.css">
  <style>
    :root {
      --bg: #f3f0f9;
      --purple: #7c3aed;
      --purple-light: #a855f7;
      --purple-soft: rgba(124, 58, 237, 0.11);
      --purple-border: rgba(124, 58, 237, 0.22);
      --text: #1a1625;
      --text-muted: #6b6480;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-strong: rgba(255, 255, 255, 0.84);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 18px;
      --shadow: 0 10px 40px rgba(124, 58, 237, 0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 85% -10%, rgba(168, 85, 247, 0.22), transparent),
        radial-gradient(ellipse 60% 40% at -10% 80%, rgba(124, 58, 237, 0.14), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    .sidebar {
      width: 250px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--purple-border);
      display: flex;
      flex-direction: column;
      padding: 28px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 6px 32px;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #7c3aed, #c084fc);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: block;
    }

    .logo-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--purple);
      background: var(--purple-soft);
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border: none;
      background: transparent;
      border-radius: 13px;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.16), rgba(168, 85, 247, 0.1));
      color: var(--purple);
      font-weight: 650;
      box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.15);
    }

    .nav-icon { font-size: 17px; width: 24px; text-align: center; opacity: 0.9; }

    .sidebar-footer {
      padding-top: 18px;
      border-top: 1px solid var(--purple-border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--glass);
      border-radius: 13px;
      font-size: 13px;
      font-weight: 550;
      border: 1px solid var(--purple-border);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      flex-shrink: 0;
    }
    .status-dot.down { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    .status-dot.warn { background: var(--warning); box-shadow: 0 0 10px var(--warning); }

    .token-pill {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      cursor: pointer;
      padding: 4px;
    }
    .token-pill:hover { color: var(--purple); }

    .main {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14.5px;
      margin-top: 5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--glass);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--purple-border);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.38);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--purple-soft);
      color: var(--purple);
    }
    .btn-secondary:hover { background: rgba(124, 58, 237, 0.2); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--purple-border);
    }
    .btn-ghost:hover {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 9px; }

    .btn-success { background: rgba(16, 185, 129, 0.13); color: var(--success); }
    .btn-success:hover { background: rgba(16, 185, 129, 0.22); }

    .btn-danger { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    .tab-content { display: none; animation: fadeUp 0.28s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 220px;
      max-width: 340px;
      padding: 12px 18px;
      border-radius: 13px;
      border: 1px solid var(--purple-border);
      background: var(--glass);
      backdrop-filter: blur(12px);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--purple-light), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(124, 58, 237, 0.14);
      border-color: rgba(124, 58, 237, 0.4);
    }
    .card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .card-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .card-status.up { background: rgba(16, 185, 129, 0.13); color: var(--success); }
    .card-status.down { background: rgba(239, 68, 68, 0.13); color: var(--danger); }
    .card-status.warn { background: rgba(245, 158, 11, 0.13); color: var(--warning); }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .card-meta b { color: var(--text); font-weight: 600; }
    .card-meta .err-line { color: var(--danger); word-break: break-word; }

    .findings {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .finding {
      font-size: 12.5px;
      padding: 8px 11px;
      border-radius: 9px;
      border-left: 3px solid var(--text-muted);
      background: rgba(0, 0, 0, 0.03);
      word-break: break-word;
    }
    .finding.high { border-left-color: var(--danger); color: var(--text); }
    .finding.medium { border-left-color: var(--warning); color: var(--text); }
    .finding .sev {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.4px;
      margin-right: 6px;
    }
    .finding.high .sev { color: var(--danger); }
    .finding.medium .sev { color: var(--warning); }

    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .compose-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
      height: calc(100vh - 190px);
      min-height: 480px;
    }

    .compose-sidebar {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 18px;
      overflow-y: auto;
    }

    .compose-sidebar h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 650;
    }

    .compose-item {
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 4px;
    }
    .compose-item:hover { background: var(--purple-soft); }
    .compose-item.active {
      background: rgba(124, 58, 237, 0.15);
      color: var(--purple);
      font-weight: 600;
    }

    .compose-editor-wrap {
      display: flex;
      flex-direction: column;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .compose-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--purple-border);
      background: var(--glass-strong);
      gap: 12px;
      flex-wrap: wrap;
    }

    .compose-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .CodeMirror {
      flex: 1;
      height: 100% !important;
      font-size: 13.5px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      border-radius: 0;
    }

    .validation-result {
      padding: 11px 18px;
      font-size: 13.5px;
      border-top: 1px solid var(--purple-border);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .validation-result.ok { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .validation-result.err { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    .utils-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .util-card {
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      transition: transform 0.25s;
    }
    .util-card:hover { transform: translateY(-3px); }

    .util-card h3 {
      font-size: 19px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .util-status {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .util-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(124, 58, 237, 0.07);
      font-size: 13.5px;
    }
    .util-row:last-of-type { border-bottom: none; }

    .util-label { color: var(--text-muted); }
    .util-value {
      font-weight: 600;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      background: var(--purple-soft);
      padding: 3px 9px;
      border-radius: 7px;
      color: var(--purple);
    }

    .util-actions { margin-top: 20px; display: flex; gap: 8px; }

    .network-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .net-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.2s;
    }
    .net-card:hover { transform: translateY(-2px); }

    .net-card h4 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      font-weight: 650;
    }

    .net-card .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: -0.3px;
    }

    .net-card .sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .logs-toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .logs-window {
      background: #16131f;
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      height: calc(100vh - 250px);
      min-height: 400px;
      overflow-y: auto;
      padding: 18px 22px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .log-line { margin-bottom: 5px; word-break: break-all; }
    .log-line .time { color: #7c6f9e; margin-right: 12px; }
    .log-line .svc { color: #8b7fb8; margin-right: 8px; }
    .log-line.info { color: #c4b5fd; }
    .log-line.warn { color: #fbbf24; }
    .log-line.error { color: #f87171; }
    .log-line.success { color: #34d399; }

    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 550;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      animation: toastIn 0.3s ease;
      pointer-events: auto;
      max-width: 360px;
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warn { border-left: 4px solid var(--warning); }
    .toast.info { border-left: 4px solid var(--purple); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 960px) {
      .sidebar { width: 78px; padding: 20px 10px; }
      .logo-text, .nav-item span:not(.nav-icon), .status-pill span:last-child, .token-pill { display: none; }
      .nav-item { justify-content: center; padding: 15px; }
      .logo { justify-content: center; padding-bottom: 24px; }
      .compose-layout { grid-template-columns: 1fr; height: auto; }
      .compose-sidebar { max-height: 180px; }
      .main { padding: 22px 18px; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">A</div>
        <div class="logo-text">
          <span class="logo-name">Aether</span>
          <span class="logo-badge">AD</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-tab="services"><span class="nav-icon">⬡</span>Сервисы</button>
        <button class="nav-item" data-tab="compose"><span class="nav-icon">✎</span>Compose</button>
        <button class="nav-item" data-tab="utils"><span class="nav-icon">⚙</span>Утилиты</button>
        <button class="nav-item" data-tab="network"><span class="nav-icon">◎</span>Сеть</button>
        <button class="nav-item" data-tab="logs"><span class="nav-icon">☰</span>Логи</button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill" id="global-status">
          <span class="status-dot up"></span>
          <span>All systems up</span>
        </div>
        <div class="token-pill" id="token-pill" onclick="changeToken()">Сменить токен</div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h1 id="page-title">Сервисы</h1>
          <p class="subtitle" id="page-subtitle">Управление и мониторинг</p>
        </div>
        <div class="header-right">
          <div class="last-update">Обновлено: <span id="last-update">—</span></div>
          <button class="btn btn-ghost" id="refresh-btn">↻ Refresh</button>
        </div>
      </header>

      <!-- SERVICES -->
      <section class="tab-content active" id="tab-services">
        <div class="toolbar">
          <input type="text" class="search" id="service-search" placeholder="Поиск сервиса...">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" id="full-scan-btn" title="Обход всей файловой системы на предмет compose-файлов вне services/">Full scan</button>
            <button class="btn btn-secondary" id="restart-all">Restart All</button>
          </div>
        </div>
        <div class="cards-grid" id="services-grid"></div>
      </section>

      <!-- COMPOSE -->
      <section class="tab-content" id="tab-compose">
        <div class="compose-layout">
          <div class="compose-sidebar">
            <h3>Сервисы</h3>
            <div id="compose-list"></div>
          </div>
          <div class="compose-editor-wrap">
            <div class="compose-toolbar">
              <span id="current-compose-name" style="font-weight:600;">Выбери сервис</span>
              <div class="compose-actions">
                <button class="btn btn-secondary" id="validate-btn">Проверить YAML</button>
                <button class="btn btn-secondary" id="save-btn">Сохранить</button>
                <button class="btn btn-primary" id="save-apply-btn">Сохранить и рестарт</button>
              </div>
            </div>
            <textarea id="compose-editor"></textarea>
            <div class="validation-result" id="validation-result"></div>
          </div>
        </div>
      </section>

      <!-- UTILS -->
      <section class="tab-content" id="tab-utils">
        <div class="utils-grid" id="utils-grid"></div>
      </section>

      <!-- NETWORK -->
      <section class="tab-content" id="tab-network">
        <div class="network-grid" id="network-info"></div>
      </section>

      <!-- LOGS -->
      <section class="tab-content" id="tab-logs">
        <div class="logs-toolbar">
          <button class="btn btn-ghost" id="clear-logs">Очистить</button>
          <label class="checkbox-label">
            <input type="checkbox" id="auto-scroll" checked> Автоскролл
          </label>
        </div>
        <div class="logs-window" id="logs-window"></div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script>
    const utils = [
      { name: 'Packmate', status: 'up', port: '8081', creds: 'admin : p@ckm4te', extra: 'iface eth0 · regex flag' },
      { name: 'Ферма', status: 'up', port: '31337', creds: 'token : team_secret_xx', extra: 'teams 1-16 · HTTP' },
      { name: 'Firegex', status: 'up', port: '8750', creds: 'admin : firegex', extra: 'transparent mode' }
    ];

    const networkInfo = [
      { title: 'Board Address', value: '10.10.10.1', sub: 'jury / checksystem' },
      { title: 'Team Range', value: '10.60.1.0 — 10.60.16.0', sub: '16 команд' },
      { title: 'Protocol', value: 'TCP + HTTP', sub: 'flag submission' },
      { title: 'First / Last IP', value: '10.60.1.2 / 10.60.16.2', sub: 'vulnbox' },
      { title: 'Docker Network', value: 'ad_net', sub: 'overlay' },
      { title: 'VPN', value: 'WireGuard', sub: 'active · 16 peers' }
    ];

    let services = [];
    let logs = [];
    let TOKEN = localStorage.getItem('monitor_token') || '';

    let currentTab = 'services';
    let currentComposeId = null;
    let editor = null;
    let autoScroll = true;

    function ensureToken() {
      if (!TOKEN) {
        TOKEN = window.prompt('Access token (см. вывод monitor.sh при запуске утилиты):') || '';
        localStorage.setItem('monitor_token', TOKEN);
      }
    }

    function changeToken() {
      const t = window.prompt('Новый access token:', TOKEN || '');
      if (t === null) return;
      TOKEN = t;
      localStorage.setItem('monitor_token', TOKEN);
      toast('info', 'Токен обновлён');
      loadState();
    }

    async function api(path, opts = {}) {
      ensureToken();
      opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + TOKEN });
      let res;
      try {
        res = await fetch(path, opts);
      } catch (e) {
        toast('error', 'Бэкенд недоступен: ' + e.message);
        throw e;
      }
      if (res.status === 401) {
        localStorage.removeItem('monitor_token');
        TOKEN = '';
        toast('error', 'Неверный токен, введите заново');
        throw new Error('unauthorized');
      }
      return res;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    document.addEventListener('DOMContentLoaded', () => {
      ensureToken();
      renderUtils();
      renderNetwork();
      setupNav();
      setupCompose();
      setupActions();
      updateLastTime();

      loadState();
      loadLogs();

      setInterval(loadState, 15000);
      setInterval(() => { if (currentTab === 'logs') loadLogs(); }, 5000);
    });

    async function loadState() {
      try {
        const res = await api('/api/state');
        const data = await res.json();
        services = Object.values(data.services || {}).sort((a, b) => a.name.localeCompare(b.name));
        renderServices(document.getElementById('service-search')?.value || '');
        if (currentTab === 'compose') refreshComposeList();
        updateGlobalStatus();
        updateLastTime();
      } catch (e) {}
    }

    async function loadLogs() {
      try {
        const res = await api('/api/logs?tail=300');
        const data = await res.json();
        logs = data.logs || [];
        if (currentTab === 'logs') renderLogs();
      } catch (e) {}
    }

    function statusClass(s) {
      if (s === 'up') return 'up';
      if (s === 'error') return 'down';
      return 'warn';
    }

    function renderServices(filter = '') {
      const grid = document.getElementById('services-grid');
      const filtered = services.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="color:var(--text-muted);padding:20px;">Сервисы не найдены. Проверь services/*/docker-compose.yaml и нажми Refresh.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const cls = statusClass(s.status);
        const ports = (s.ports || []).map(p => p.split(':')[0]).join(', ') || '—';
        const containers = (s.containers || []).join(', ') || '—';
        const findings = s.findings || [];
        const findingsHtml = findings.length ? `
          <div class="findings">
            ${findings.map(f => `<div class="finding ${escapeHtml(f.severity)}"><span class="sev">${escapeHtml(f.severity)}</span>${escapeHtml(f.message)}</div>`).join('')}
          </div>` : '';
        return `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${escapeHtml(s.name)}</div>
            <div class="card-status ${cls}">
              <span class="status-dot ${cls}" style="width:7px;height:7px;display:inline-block;"></span>
              ${escapeHtml(s.status || 'unknown')}
            </div>
          </div>
          <div class="card-meta">
            <span>Ports: <b>${escapeHtml(ports)}</b></span>
            <span>Containers: ${escapeHtml(containers)}</span>
            ${s.source === 'scanned' ? `<span title="${escapeHtml(s.path || '')}">Найден full-scan, вне services/</span>` : ''}
            ${s.last_error ? `<span class="err-line">${escapeHtml(String(s.last_error).slice(0, 160))}</span>` : ''}
          </div>
          ${findingsHtml}
          <div class="card-actions">
            <button class="btn btn-sm btn-success" onclick="serviceAction('${s.name}','start')">Start</button>
            <button class="btn btn-sm btn-danger" onclick="serviceAction('${s.name}','stop')">Stop</button>
            <button class="btn btn-sm btn-secondary" onclick="serviceAction('${s.name}','restart')">Restart</button>
          </div>
        </div>
      `;
      }).join('');
    }

    async function serviceAction(name, action) {
      try {
        await api(`/api/services/${encodeURIComponent(name)}/${action}`, { method: 'POST' });
        toast('info', `${name} → ${action} queued`);
        addLocalLog('info', name, `${action} requested from board`);
        setTimeout(loadState, 1500);
        setTimeout(loadState, 4000);
      } catch (e) {}
    }

    function setupNav() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const titles = {
        services: ['Сервисы', 'Управление и мониторинг'],
        compose: ['Compose', 'Редактирование docker-compose.yaml в рантайме'],
        utils: ['Утилиты', 'Packmate · Ферма · Firegex'],
        network: ['Сеть', 'Информация о текущей инфраструктуре'],
        logs: ['Логи', 'События, варны и ошибки']
      };
      document.getElementById('page-title').textContent = titles[tab][0];
      document.getElementById('page-subtitle').textContent = titles[tab][1];

      if (tab === 'logs') { loadLogs(); }
      if (tab === 'compose') { refreshComposeList(); if (editor) setTimeout(() => editor.refresh(), 50); }
    }

    function setupCompose() {
      editor = CodeMirror.fromTextArea(document.getElementById('compose-editor'), {
        mode: 'yaml',
        theme: 'material-palenight',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        autofocus: false
      });

      document.getElementById('validate-btn').addEventListener('click', validateYaml);
      document.getElementById('save-btn').addEventListener('click', () => saveCompose(false));
      document.getElementById('save-apply-btn').addEventListener('click', () => {
        if (confirm(`Сохранить и перезапустить "${currentComposeId}"? Сервис будет недоступен на несколько секунд.`)) {
          saveCompose(true);
        }
      });
    }

    function refreshComposeList() {
      const list = document.getElementById('compose-list');
      list.innerHTML = services.map(s =>
        `<div class="compose-item ${s.name === currentComposeId ? 'active' : ''}" data-id="${s.name}" onclick="selectCompose('${s.name}')">${escapeHtml(s.name)}</div>`
      ).join('');
    }

    async function selectCompose(id) {
      currentComposeId = id;
      document.querySelectorAll('.compose-item').forEach(i => i.classList.toggle('active', i.dataset.id === id));
      document.getElementById('current-compose-name').textContent = id;
      const res_el = document.getElementById('validation-result');
      res_el.textContent = 'Загрузка...';
      res_el.className = 'validation-result';
      try {
        const res = await api(`/api/compose/${encodeURIComponent(id)}`);
        const data = await res.json();
        editor.setValue(data.content || '');
        res_el.textContent = '';
      } catch (e) {
        res_el.textContent = 'Не удалось загрузить compose-файл';
        res_el.className = 'validation-result err';
      }
      setTimeout(() => editor.refresh(), 30);
    }

    async function validateYaml() {
      if (!currentComposeId) { toast('warn', 'Сначала выбери сервис'); return; }
      const result = document.getElementById('validation-result');
      result.textContent = 'Проверка...';
      result.className = 'validation-result';
      try {
        const res = await api(`/api/compose/${encodeURIComponent(currentComposeId)}/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: editor.getValue() })
        });
        const data = await res.json();
        if (data.ok) {
          result.textContent = '✓ ' + (data.message || 'YAML валиден');
          result.className = 'validation-result ok';
          toast('success', 'YAML проверен');
        } else {
          result.textContent = '✗ ' + (data.message || 'YAML невалиден');
          result.className = 'validation-result err';
          toast('error', 'YAML невалиден');
        }
      } catch (e) {}
    }

    async function saveCompose(apply) {
      if (!currentComposeId) { toast('warn', 'Сначала выбери сервис'); return; }
      const result = document.getElementById('validation-result');
      result.textContent = 'Сохранение...';
      result.className = 'validation-result';
      try {
        const res = await api(`/api/compose/${encodeURIComponent(currentComposeId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: editor.getValue(), apply: !!apply })
        });
        const data = await res.json();
        if (data.ok) {
          result.textContent = '✓ ' + (data.message || 'Сохранено') + (apply ? ' — рестарт запущен' : ' — рестарт вручную (Services)');
          result.className = 'validation-result ok';
          toast('success', apply ? `${currentComposeId} сохранён, рестарт запущен` : `${currentComposeId} сохранён`);
          if (apply) { setTimeout(loadState, 1500); setTimeout(loadState, 4000); }
        } else {
          result.textContent = '✗ ' + (data.message || 'Не удалось сохранить');
          result.className = 'validation-result err';
          toast('error', 'Ошибка сохранения — файл не тронут');
        }
      } catch (e) {}
    }

    function renderUtils() {
      document.getElementById('utils-grid').innerHTML = utils.map(u => `
        <div class="util-card">
          <h3>
            ${u.name}
            <span class="util-status" style="background:${u.status === 'up' ? 'rgba(16,185,129,0.13)' : 'rgba(239,68,68,0.13)'};color:${u.status === 'up' ? '#10b981' : '#ef4444'}">
              ${u.status.toUpperCase()}
            </span>
          </h3>
          <div class="util-row"><span class="util-label">Port</span><span class="util-value">${u.port}</span></div>
          <div class="util-row"><span class="util-label">Credentials</span><span class="util-value">${u.creds}</span></div>
          <div class="util-row"><span class="util-label">Info</span><span class="util-value">${u.extra}</span></div>
          <div class="util-actions">
            <button class="btn btn-sm btn-ghost" disabled title="Вне скоупа этого модуля">Ещё не подключено</button>
          </div>
        </div>
      `).join('');
    }

    function renderNetwork() {
      document.getElementById('network-info').innerHTML = networkInfo.map(n => `
        <div class="net-card">
          <h4>${n.title}</h4>
          <div class="value">${n.value}</div>
          <div class="sub">${n.sub}</div>
        </div>
      `).join('');
    }

    function renderLogs() {
      const win = document.getElementById('logs-window');
      win.innerHTML = logs.map(l => `
        <div class="log-line ${l.level}"><span class="time">[${escapeHtml(l.time)}]</span><span class="svc">${escapeHtml(l.service)}</span>${escapeHtml(l.msg)}</div>
      `).join('');
      if (autoScroll) win.scrollTop = win.scrollHeight;
    }

    function addLocalLog(level, service, msg) {
      const time = new Date().toTimeString().slice(0, 8);
      logs.push({ time, level, service, msg });
      if (logs.length > 400) logs.shift();
      if (currentTab === 'logs') renderLogs();
    }

    function setupActions() {
      document.getElementById('service-search').addEventListener('input', e => renderServices(e.target.value));

      document.getElementById('refresh-btn').addEventListener('click', async () => {
        try {
          await api('/api/rescan', { method: 'POST' });
          toast('info', 'Пересканирование запущено');
          setTimeout(loadState, 1200);
        } catch (e) {}
        loadLogs();
      });

      document.getElementById('full-scan-btn').addEventListener('click', async () => {
        try {
          await api('/api/full-scan', { method: 'POST' });
          toast('info', 'Full scan запущен — обход всей ФС, это может занять минуты');
          setTimeout(loadState, 5000);
          setTimeout(loadState, 20000);
          setTimeout(loadState, 60000);
        } catch (e) {}
      });

      document.getElementById('restart-all').addEventListener('click', async () => {
        if (!confirm('Передёрнуть (down + up -d) ВСЕ сервисы? Это профилактическая операция, все сервисы будут недоступны на несколько секунд.')) return;
        try {
          await api('/api/restart-all', { method: 'POST' });
          toast('warn', 'Restart All запущен');
          setTimeout(loadState, 2000);
          setTimeout(loadState, 6000);
        } catch (e) {}
      });

      document.getElementById('clear-logs').addEventListener('click', () => {
        logs = [];
        renderLogs();
      });

      document.getElementById('auto-scroll').addEventListener('change', e => {
        autoScroll = e.target.checked;
      });
    }

    function updateGlobalStatus() {
      const hasError = services.some(s => s.status === 'error');
      const hasOther = services.some(s => s.status !== 'up' && s.status !== 'error');
      const pill = document.getElementById('global-status');

      if (hasError) {
        pill.innerHTML = `<span class="status-dot down"></span><span>Degraded</span>`;
      } else if (hasOther) {
        pill.innerHTML = `<span class="status-dot warn"></span><span>Some stopped</span>`;
      } else {
        pill.innerHTML = `<span class="status-dot up"></span><span>All systems up</span>`;
      }
    }

    function updateLastTime() {
      document.getElementById('last-update').textContent = new Date().toTimeString().slice(0, 8);
    }

    function toast(type, text) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = text;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = 'all 0.25s';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }
  </script>
</body>
</html>
