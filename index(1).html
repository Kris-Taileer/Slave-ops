<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether — AD Control Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-palenight.min.css">
  <style>
    :root {
      --bg: #f3f0f9;
      --purple: #7c3aed;
      --purple-light: #a855f7;
      --purple-soft: rgba(124, 58, 237, 0.11);
      --purple-border: rgba(124, 58, 237, 0.22);
      --text: #1a1625;
      --text-muted: #6b6480;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-strong: rgba(255, 255, 255, 0.84);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 18px;
      --shadow: 0 10px 40px rgba(124, 58, 237, 0.09);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 85% -10%, rgba(168, 85, 247, 0.22), transparent),
        radial-gradient(ellipse 60% 40% at -10% 80%, rgba(124, 58, 237, 0.14), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 250px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--purple-border);
      display: flex;
      flex-direction: column;
      padding: 28px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 6px 32px;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #7c3aed, #c084fc);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      display: block;
    }

    .logo-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--purple);
      background: var(--purple-soft);
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border: none;
      background: transparent;
      border-radius: 13px;
      color: var(--text-muted);
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.16), rgba(168, 85, 247, 0.1));
      color: var(--purple);
      font-weight: 650;
      box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.15);
    }

    .nav-icon { font-size: 17px; width: 24px; text-align: center; opacity: 0.9; }

    .sidebar-footer {
      padding-top: 18px;
      border-top: 1px solid var(--purple-border);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--glass);
      border-radius: 13px;
      font-size: 13px;
      font-weight: 550;
      border: 1px solid var(--purple-border);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
      flex-shrink: 0;
    }
    .status-dot.down { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
    .status-dot.warn { background: var(--warning); box-shadow: 0 0 10px var(--warning); }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      padding: 32px 40px;
      overflow-y: auto;
      max-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14.5px;
      margin-top: 5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--glass);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--purple-border);
    }

    /* ===== BUTTONS ===== */
    .btn {
      padding: 10px 18px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.38);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.45);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--purple-soft);
      color: var(--purple);
    }
    .btn-secondary:hover { background: rgba(124, 58, 237, 0.2); }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--purple-border);
    }
    .btn-ghost:hover {
      background: var(--purple-soft);
      color: var(--purple);
    }

    .btn-sm { padding: 7px 13px; font-size: 12.5px; border-radius: 9px; }

    .btn-success { background: rgba(16, 185, 129, 0.13); color: var(--success); }
    .btn-success:hover { background: rgba(16, 185, 129, 0.22); }

    .btn-danger { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ===== TABS ===== */
    .tab-content { display: none; animation: fadeUp 0.28s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SERVICES ===== */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 220px;
      max-width: 340px;
      padding: 12px 18px;
      border-radius: 13px;
      border: 1px solid var(--purple-border);
      background: var(--glass);
      backdrop-filter: blur(12px);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--purple-light), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(124, 58, 237, 0.14);
      border-color: rgba(124, 58, 237, 0.4);
    }
    .card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 10px;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .card-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .card-status.up { background: rgba(16, 185, 129, 0.13); color: var(--success); }
    .card-status.down { background: rgba(239, 68, 68, 0.13); color: var(--danger); }
    .card-status.warn { background: rgba(245, 158, 11, 0.13); color: var(--warning); }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 18px;
      font-size: 13.5px;
      color: var(--text-muted);
    }
    .card-meta b { color: var(--text); font-weight: 600; }

    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ===== COMPOSE ===== */
    .compose-layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
      height: calc(100vh - 190px);
      min-height: 480px;
    }

    .compose-sidebar {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 18px;
      overflow-y: auto;
    }

    .compose-sidebar h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 650;
    }

    .compose-item {
      padding: 11px 14px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 4px;
    }
    .compose-item:hover { background: var(--purple-soft); }
    .compose-item.active {
      background: rgba(124, 58, 237, 0.15);
      color: var(--purple);
      font-weight: 600;
    }

    .compose-editor-wrap {
      display: flex;
      flex-direction: column;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .compose-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--purple-border);
      background: var(--glass-strong);
      gap: 12px;
      flex-wrap: wrap;
    }

    .compose-actions { display: flex; gap: 8px; }

    .CodeMirror {
      flex: 1;
      height: 100% !important;
      font-size: 13.5px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      border-radius: 0;
    }

    .validation-result {
      padding: 11px 18px;
      font-size: 13.5px;
      border-top: 1px solid var(--purple-border);
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .validation-result.ok { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .validation-result.err { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    /* ===== UTILS ===== */
    .utils-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .util-card {
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      transition: transform 0.25s;
    }
    .util-card:hover { transform: translateY(-3px); }

    .util-card h3 {
      font-size: 19px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .util-status {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .util-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(124, 58, 237, 0.07);
      font-size: 13.5px;
    }
    .util-row:last-of-type { border-bottom: none; }

    .util-label { color: var(--text-muted); }
    .util-value {
      font-weight: 600;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      background: var(--purple-soft);
      padding: 3px 9px;
      border-radius: 7px;
      color: var(--purple);
    }

    .util-actions { margin-top: 20px; display: flex; gap: 8px; }

    /* ===== NETWORK ===== */
    .network-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .net-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.2s;
    }
    .net-card:hover { transform: translateY(-2px); }

    .net-card h4 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      font-weight: 650;
    }

    .net-card .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--purple);
      letter-spacing: -0.3px;
    }

    .net-card .sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* ===== LOGS ===== */
    .logs-toolbar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .logs-window {
      background: #16131f;
      border: 1px solid var(--purple-border);
      border-radius: var(--radius);
      height: calc(100vh - 250px);
      min-height: 400px;
      overflow-y: auto;
      padding: 18px 22px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .log-line { margin-bottom: 5px; word-break: break-all; }
    .log-line .time { color: #7c6f9e; margin-right: 12px; }
    .log-line.info { color: #c4b5fd; }
    .log-line.warn { color: #fbbf24; }
    .log-line.error { color: #f87171; }
    .log-line.success { color: #34d399; }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      border: 1px solid var(--purple-border);
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 550;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      animation: toastIn 0.3s ease;
      pointer-events: auto;
      max-width: 360px;
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warn { border-left: 4px solid var(--warning); }
    .toast.info { border-left: 4px solid var(--purple); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 960px) {
      .sidebar { width: 78px; padding: 20px 10px; }
      .logo-text, .nav-item span:not(.nav-icon), .status-pill span:last-child { display: none; }
      .nav-item { justify-content: center; padding: 15px; }
      .logo { justify-content: center; padding-bottom: 24px; }
      .compose-layout { grid-template-columns: 1fr; height: auto; }
      .compose-sidebar { max-height: 180px; }
      .main { padding: 22px 18px; }
      .header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">A</div>
        <div class="logo-text">
          <span class="logo-name">Aether</span>
          <span class="logo-badge">AD</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-tab="services"><span class="nav-icon">⬡</span>Сервисы</button>
        <button class="nav-item" data-tab="compose"><span class="nav-icon">✎</span>Compose</button>
        <button class="nav-item" data-tab="utils"><span class="nav-icon">⚙</span>Утилиты</button>
        <button class="nav-item" data-tab="network"><span class="nav-icon">◎</span>Сеть</button>
        <button class="nav-item" data-tab="logs"><span class="nav-icon">☰</span>Логи</button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-pill" id="global-status">
          <span class="status-dot up"></span>
          <span>All systems up</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div>
          <h1 id="page-title">Сервисы</h1>
          <p class="subtitle" id="page-subtitle">Управление и мониторинг</p>
        </div>
        <div class="header-right">
          <div class="last-update">Обновлено: <span id="last-update">—</span></div>
          <button class="btn btn-ghost" id="refresh-btn">↻ Refresh</button>
        </div>
      </header>

      <!-- SERVICES -->
      <section class="tab-content active" id="tab-services">
        <div class="toolbar">
          <input type="text" class="search" id="service-search" placeholder="Поиск сервиса...">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary" id="restart-all">Restart All</button>
          </div>
        </div>
        <div class="cards-grid" id="services-grid"></div>
      </section>

      <!-- COMPOSE -->
      <section class="tab-content" id="tab-compose">
        <div class="compose-layout">
          <div class="compose-sidebar">
            <h3>Сервисы</h3>
            <div id="compose-list"></div>
          </div>
          <div class="compose-editor-wrap">
            <div class="compose-toolbar">
              <span id="current-compose-name" style="font-weight:600;">Выбери сервис</span>
              <div class="compose-actions">
                <button class="btn btn-secondary" id="validate-btn">Проверить YAML</button>
                <button class="btn btn-primary" id="save-compose-btn">Сохранить и применить</button>
              </div>
            </div>
            <textarea id="compose-editor"></textarea>
            <div class="validation-result" id="validation-result"></div>
          </div>
        </div>
      </section>

      <!-- UTILS -->
      <section class="tab-content" id="tab-utils">
        <div class="utils-grid" id="utils-grid"></div>
      </section>

      <!-- NETWORK -->
      <section class="tab-content" id="tab-network">
        <div class="network-grid" id="network-info"></div>
      </section>

      <!-- LOGS -->
      <section class="tab-content" id="tab-logs">
        <div class="logs-toolbar">
          <button class="btn btn-ghost" id="clear-logs">Очистить</button>
          <label class="checkbox-label">
            <input type="checkbox" id="auto-scroll" checked> Автоскролл
          </label>
        </div>
        <div class="logs-window" id="logs-window"></div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script>
    // ===================== MOCK DATA =====================
    const services = [
      {
        id: 'web',
        name: 'web-service',
        status: 'up',
        ports: '80, 443',
        containers: 'nginx + app',
        compose: `version: "3.8"
services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - ad_net
  app:
    image: team-web:latest
    expose:
      - "3000"
    networks:
      - ad_net

networks:
  ad_net:
    external: true`
      },
      {
        id: 'api',
        name: 'api-gateway',
        status: 'up',
        ports: '8080',
        containers: 'api + redis',
        compose: `version: "3.8"
services:
  api:
    image: api:latest
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - redis
    networks:
      - ad_net
  redis:
    image: redis:alpine
    networks:
      - ad_net

networks:
  ad_net:
    external: true`
      },
      {
        id: 'db',
        name: 'postgres-db',
        status: 'warn',
        ports: '5432',
        containers: 'postgres',
        compose: `version: "3.8"
services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: ad
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ad_net

volumes:
  pgdata:

networks:
  ad_net:
    external: true`
      },
      {
        id: 'checker',
        name: 'checker',
        status: 'down',
        ports: '9000',
        containers: 'checker',
        compose: `version: "3.8"
services:
  checker:
    image: checker:latest
    ports:
      - "9000:9000"
    restart: always
    networks:
      - ad_net

networks:
  ad_net:
    external: true`
      },
      {
        id: 'sploit',
        name: 'sploit-runner',
        status: 'up',
        ports: '—',
        containers: 'sploit',
        compose: `version: "3.8"
services:
  sploit:
    image: sploit:latest
    environment:
      - TEAM_TOKEN=xxx
      - FARM_URL=http://farm:31337
    networks:
      - ad_net

networks:
  ad_net:
    external: true`
      }
    ];

    const utils = [
      { name: 'Packmate', status: 'up', port: '8081', creds: 'admin : p@ckm4te', extra: 'iface eth0 · regex flag' },
      { name: 'Ферма', status: 'up', port: '31337', creds: 'token : team_secret_xx', extra: 'teams 1-16 · HTTP' },
      { name: 'Firegex', status: 'up', port: '8750', creds: 'admin : firegex', extra: 'transparent mode' }
    ];

    const networkInfo = [
      { title: 'Board Address', value: '10.10.10.1', sub: 'jury / checksystem' },
      { title: 'Team Range', value: '10.60.1.0 — 10.60.16.0', sub: '16 команд' },
      { title: 'Protocol', value: 'TCP + HTTP', sub: 'flag submission' },
      { title: 'First / Last IP', value: '10.60.1.2 / 10.60.16.2', sub: 'vulnbox' },
      { title: 'Docker Network', value: 'ad_net', sub: 'overlay' },
      { title: 'VPN', value: 'WireGuard', sub: 'active · 16 peers' }
    ];

    let logs = [
      { time: '11:28:01', level: 'info', msg: 'Aether panel started' },
      { time: '11:28:03', level: 'success', msg: 'Discovered 5 services in /services' },
      { time: '11:28:05', level: 'info', msg: 'Packmate is up on :8081' },
      { time: '11:28:06', level: 'info', msg: 'Farm worker + submitter started' },
      { time: '11:28:08', level: 'success', msg: 'Firegex deployed successfully' },
      { time: '11:29:12', level: 'warn', msg: 'postgres-db high memory (82%)' },
      { time: '11:30:01', level: 'info', msg: 'Healthcheck cycle started' },
      { time: '11:30:04', level: 'error', msg: 'checker is DOWN — connection refused :9000' },
      { time: '11:30:15', level: 'info', msg: 'Ping cycle completed' }
    ];

    // ===================== STATE =====================
    let currentTab = 'services';
    let currentComposeId = null;
    let editor = null;
    let autoScroll = true;

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', () => {
      renderServices();
      renderUtils();
      renderNetwork();
      renderLogs();
      setupNav();
      setupCompose();
      setupActions();
      updateLastTime();
      updateGlobalStatus();

      setInterval(() => {
        mockPing();
        updateLastTime();
      }, 60000);
    });

    // ===================== RENDER =====================
    function renderServices(filter = '') {
      const grid = document.getElementById('services-grid');
      const filtered = services.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));

      grid.innerHTML = filtered.map(s => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${s.name}</div>
            <div class="card-status ${s.status}">
              <span class="status-dot ${s.status}" style="width:7px;height:7px;display:inline-block;"></span>
              ${s.status}
            </div>
          </div>
          <div class="card-meta">
            <span>Ports: <b>${s.ports}</b></span>
            <span>Containers: ${s.containers}</span>
          </div>
          <div class="card-actions">
            <button class="btn btn-sm btn-success" onclick="serviceAction('${s.id}','start')">Start</button>
            <button class="btn btn-sm btn-danger" onclick="serviceAction('${s.id}','stop')">Stop</button>
            <button class="btn btn-sm btn-secondary" onclick="serviceAction('${s.id}','restart')">Restart</button>
          </div>
        </div>
      `).join('');
    }

    function renderUtils() {
      document.getElementById('utils-grid').innerHTML = utils.map(u => `
        <div class="util-card">
          <h3>
            ${u.name}
            <span class="util-status" style="background:${u.status==='up'?'rgba(16,185,129,0.13)':'rgba(239,68,68,0.13)'};color:${u.status==='up'?'#10b981':'#ef4444'}">
              ${u.status.toUpperCase()}
            </span>
          </h3>
          <div class="util-row"><span class="util-label">Port</span><span class="util-value">${u.port}</span></div>
          <div class="util-row"><span class="util-label">Credentials</span><span class="util-value">${u.creds}</span></div>
          <div class="util-row"><span class="util-label">Info</span><span class="util-value">${u.extra}</span></div>
          <div class="util-actions">
            <button class="btn btn-sm btn-secondary" onclick="toast('info','${u.name}: restart queued');addLog('info','${u.name} restart requested')">Restart</button>
            <button class="btn btn-sm btn-ghost" onclick="toast('info','Open ${u.name} — mock')">Open</button>
          </div>
        </div>
      `).join('');
    }

    function renderNetwork() {
      document.getElementById('network-info').innerHTML = networkInfo.map(n => `
        <div class="net-card">
          <h4>${n.title}</h4>
          <div class="value">${n.value}</div>
          <div class="sub">${n.sub}</div>
        </div>
      `).join('');
    }

    function renderLogs() {
      const win = document.getElementById('logs-window');
      win.innerHTML = logs.map(l => `
        <div class="log-line ${l.level}"><span class="time">[${l.time}]</span>${l.msg}</div>
      `).join('');
      if (autoScroll) win.scrollTop = win.scrollHeight;
    }

    // ===================== NAV =====================
    function setupNav() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const titles = {
        services: ['Сервисы', 'Управление и мониторинг'],
        compose: ['Compose', 'Редактирование docker-compose.yaml в рантайме'],
        utils: ['Утилиты', 'Packmate · Ферма · Firegex'],
        network: ['Сеть', 'Информация о текущей инфраструктуре'],
        logs: ['Логи', 'События, варны и ошибки']
      };
      document.getElementById('page-title').textContent = titles[tab][0];
      document.getElementById('page-subtitle').textContent = titles[tab][1];

      if (tab === 'logs') renderLogs();
      if (tab === 'compose' && editor) setTimeout(() => editor.refresh(), 50);
    }

    // ===================== COMPOSE =====================
    function setupCompose() {
      document.getElementById('compose-list').innerHTML = services.map(s =>
        `<div class="compose-item" data-id="${s.id}" onclick="selectCompose('${s.id}')">${s.name}</div>`
      ).join('');

      editor = CodeMirror.fromTextArea(document.getElementById('compose-editor'), {
        mode: 'yaml',
        theme: 'material-palenight',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        autofocus: false
      });

      document.getElementById('validate-btn').addEventListener('click', validateYaml);
      document.getElementById('save-compose-btn').addEventListener('click', saveCompose);
    }

    function selectCompose(id) {
      currentComposeId = id;
      document.querySelectorAll('.compose-item').forEach(i => i.classList.remove('active'));
      document.querySelector(`.compose-item[data-id="${id}"]`).classList.add('active');

      const svc = services.find(s => s.id === id);
      document.getElementById('current-compose-name').textContent = svc.name;
      editor.setValue(svc.compose);
      const res = document.getElementById('validation-result');
      res.textContent = '';
      res.className = 'validation-result';
      setTimeout(() => editor.refresh(), 30);
    }

    function validateYaml() {
      const content = editor.getValue().trim();
      const result = document.getElementById('validation-result');

      if (!content) {
        result.textContent = '✗ Пустой файл';
        result.className = 'validation-result err';
        return;
      }
      if (!content.includes('services:')) {
        result.textContent = '✗ Отсутствует ключ services';
        result.className = 'validation-result err';
        return;
      }
      if (content.includes('\t')) {
        result.textContent = '✗ В YAML лучше не использовать табы';
        result.className = 'validation-result err';
        return;
      }

      result.textContent = '✓ YAML выглядит валидно (мок). На бэке будет docker compose config';
      result.className = 'validation-result ok';
      addLog('success', `YAML validated → ${currentComposeId || 'unknown'}`);
      toast('success', 'YAML проверен');
    }

    function saveCompose() {
      if (!currentComposeId) {
        toast('warn', 'Сначала выбери сервис');
        return;
      }
      const svc = services.find(s => s.id === currentComposeId);
      svc.compose = editor.getValue();
      addLog('info', `Compose saved & applied → ${svc.name}`);
      document.getElementById('validation-result').textContent = '✓ Сохранено (мок). В реале: docker compose up -d';
      document.getElementById('validation-result').className = 'validation-result ok';
      toast('success', `${svc.name} обновлён`);
    }

    // ===================== ACTIONS =====================
    function setupActions() {
      document.getElementById('service-search').addEventListener('input', e => renderServices(e.target.value));

      document.getElementById('refresh-btn').addEventListener('click', () => {
        mockPing();
        updateLastTime();
        toast('info', 'Данные обновлены');
        addLog('info', 'Manual refresh');
      });

      document.getElementById('restart-all').addEventListener('click', () => {
        services.forEach(s => { if (s.status !== 'up') s.status = 'up'; });
        renderServices(document.getElementById('service-search').value);
        updateGlobalStatus();
        toast('warn', 'Restart All отправлен');
        addLog('warn', 'Restart All requested');
      });

      document.getElementById('clear-logs').addEventListener('click', () => {
        logs = [];
        renderLogs();
      });

      document.getElementById('auto-scroll').addEventListener('change', e => {
        autoScroll = e.target.checked;
      });
    }

    function serviceAction(id, action) {
      const svc = services.find(s => s.id === id);
      if (!svc) return;

      if (action === 'start') {
        svc.status = 'up';
        addLog('success', `${svc.name} started`);
        toast('success', `${svc.name} → started`);
      } else if (action === 'stop') {
        svc.status = 'down';
        addLog('warn', `${svc.name} stopped`);
        toast('warn', `${svc.name} → stopped`);
      } else if (action === 'restart') {
        svc.status = 'up';
        addLog('info', `${svc.name} restarted`);
        toast('info', `${svc.name} → restarted`);
      }
      renderServices(document.getElementById('service-search').value);
      updateGlobalStatus();
    }

    function mockPing() {
      if (Math.random() > 0.65) {
        const idx = Math.floor(Math.random() * services.length);
        const old = services[idx].status;
        services[idx].status = old === 'up' ? (Math.random() > 0.5 ? 'warn' : 'down') : 'up';
        const level = services[idx].status === 'up' ? 'success' : 'error';
        addLog(level, `Healthcheck: ${services[idx].name} → ${services[idx].status.toUpperCase()}`);
      }
      renderServices(document.getElementById('service-search').value);
      updateGlobalStatus();
    }

    function updateGlobalStatus() {
      const hasDown = services.some(s => s.status === 'down');
      const hasWarn = services.some(s => s.status === 'warn');
      const pill = document.getElementById('global-status');

      if (hasDown) {
        pill.innerHTML = `<span class="status-dot down"></span><span>Degraded</span>`;
      } else if (hasWarn) {
        pill.innerHTML = `<span class="status-dot warn"></span><span>Warnings</span>`;
      } else {
        pill.innerHTML = `<span class="status-dot up"></span><span>All systems up</span>`;
      }
    }

    function addLog(level, msg) {
      const time = new Date().toTimeString().slice(0, 8);
      logs.push({ time, level, msg });
      if (logs.length > 120) logs.shift();
      if (currentTab === 'logs') renderLogs();
    }

    function updateLastTime() {
      document.getElementById('last-update').textContent = new Date().toTimeString().slice(0, 8);
    }

    function toast(type, text) {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = text;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = 'all 0.25s';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }
  </script>
</body>
</html>
