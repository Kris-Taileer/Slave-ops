scrape_configs:
  - job_name: 'neo_server'
    scrape_interval: 10s
    scrape_timeout: 3s
    static_configs:
      - targets: ['neo-server:3000']

  - job_name: 's4d_farm_api'
    scrape_interval: 10s
    scrape_timeout: 3s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['s4d-front:80']

  - job_name: 's4d_farm_celery'
    scrape_interval: 10s
    scrape_timeout: 3s
    metrics_path: '/celery/metrics'
    static_configs:
      - targets: ['s4d-front:80']
